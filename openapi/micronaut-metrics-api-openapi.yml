openapi: 3.0.3
info:
  title: Micronaut Management Endpoints Beans Metrics API
  description: Micronaut Management provides built-in endpoints for monitoring and managing Micronaut applications. Endpoints include health checks, application info, beans introspection, loggers management, metrics, routes, environment, and thread dumps.
  version: 4.7.0
  contact:
    name: Micronaut Team
    url: https://micronaut.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080
  description: Default Micronaut server
tags:
- name: Metrics
paths:
  /metrics:
    get:
      operationId: listMetrics
      summary: Micronaut List available metrics
      tags:
      - Metrics
      responses:
        '200':
          description: Metric names
          content:
            application/json:
              schema:
                type: object
                properties:
                  names:
                    type: array
                    items:
                      type: string
  /metrics/{name}:
    get:
      operationId: getMetric
      summary: Micronaut Get metric details
      tags:
      - Metrics
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Metric measurements
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  measurements:
                    type: array
                    items:
                      type: object
                      properties:
                        statistic:
                          type: string
                        value:
                          type: number
                  availableTags:
                    type: array
                    items:
                      type: object
                      properties:
                        tag:
                          type: string
                        values:
                          type: array
                          items:
                            type: string
