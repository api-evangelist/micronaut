openapi: 3.0.3
info:
  title: Micronaut Management Endpoints Beans Loggers API
  description: Micronaut Management provides built-in endpoints for monitoring and managing Micronaut applications. Endpoints include health checks, application info, beans introspection, loggers management, metrics, routes, environment, and thread dumps.
  version: 4.7.0
  contact:
    name: Micronaut Team
    url: https://micronaut.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:8080
  description: Default Micronaut server
tags:
- name: Loggers
paths:
  /loggers:
    get:
      operationId: getLoggers
      summary: Micronaut List all loggers
      description: Returns all logger configurations and their levels
      tags:
      - Loggers
      responses:
        '200':
          description: Logger configurations
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: array
                    items:
                      type: string
                  loggers:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/LoggerInfo'
  /loggers/{name}:
    get:
      operationId: getLogger
      summary: Micronaut Get logger level
      tags:
      - Loggers
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Logger level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggerInfo'
    post:
      operationId: setLoggerLevel
      summary: Micronaut Set logger level
      tags:
      - Loggers
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                configuredLevel:
                  type: string
                  enum:
                  - TRACE
                  - DEBUG
                  - INFO
                  - WARN
                  - ERROR
                  - false
      responses:
        '200':
          description: Logger level updated
components:
  schemas:
    LoggerInfo:
      type: object
      properties:
        configuredLevel:
          type: string
        effectiveLevel:
          type: string
