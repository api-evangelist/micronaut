naftiko: 1.0.0-alpha2
info:
  label: Micronaut Management Endpoints API — Info
  description: 'Micronaut Management Endpoints API — Info. 1 operations. Lead operation: Micronaut Application info. Self-contained
    Naftiko capability covering one Micronaut business surface.'
  tags:
  - Micronaut
  - Info
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICRONAUT_API_KEY: MICRONAUT_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-info
    baseUri: http://localhost:8080
    description: Micronaut Management Endpoints API — Info business capability. Self-contained, no shared references.
    resources:
    - name: info
      path: /info
      operations:
      - name: getinfo
        method: GET
        description: Micronaut Application info
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: management-info-rest
    port: 8080
    description: REST adapter for Micronaut Management Endpoints API — Info. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/info
      name: info
      description: REST surface for info.
      operations:
      - method: GET
        name: getinfo
        description: Micronaut Application info
        call: management-info.getinfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-info-mcp
    port: 9090
    transport: http
    description: MCP adapter for Micronaut Management Endpoints API — Info. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: micronaut-application-info
      description: Micronaut Application info
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-info.getinfo
      outputParameters:
      - type: object
        mapping: $.
