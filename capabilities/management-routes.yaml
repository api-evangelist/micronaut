naftiko: 1.0.0-alpha2
info:
  label: Micronaut Management Endpoints API — Routes
  description: 'Micronaut Management Endpoints API — Routes. 1 operations. Lead operation: Micronaut List application routes.
    Self-contained Naftiko capability covering one Micronaut business surface.'
  tags:
  - Micronaut
  - Routes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICRONAUT_API_KEY: MICRONAUT_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-routes
    baseUri: http://localhost:8080
    description: Micronaut Management Endpoints API — Routes business capability. Self-contained, no shared references.
    resources:
    - name: routes
      path: /routes
      operations:
      - name: getroutes
        method: GET
        description: Micronaut List application routes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: management-routes-rest
    port: 8080
    description: REST adapter for Micronaut Management Endpoints API — Routes. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/routes
      name: routes
      description: REST surface for routes.
      operations:
      - method: GET
        name: getroutes
        description: Micronaut List application routes
        call: management-routes.getroutes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-routes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Micronaut Management Endpoints API — Routes. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: micronaut-list-application-routes
      description: Micronaut List application routes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-routes.getroutes
      outputParameters:
      - type: object
        mapping: $.
