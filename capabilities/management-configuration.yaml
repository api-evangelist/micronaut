naftiko: 1.0.0-alpha2
info:
  label: Micronaut Management Endpoints API — Configuration
  description: 'Micronaut Management Endpoints API — Configuration. 1 operations. Lead operation: Micronaut Refresh application
    configuration. Self-contained Naftiko capability covering one Micronaut business surface.'
  tags:
  - Micronaut
  - Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICRONAUT_API_KEY: MICRONAUT_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-configuration
    baseUri: http://localhost:8080
    description: Micronaut Management Endpoints API — Configuration business capability. Self-contained, no shared references.
    resources:
    - name: refresh
      path: /refresh
      operations:
      - name: refresh
        method: POST
        description: Micronaut Refresh application configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: management-configuration-rest
    port: 8080
    description: REST adapter for Micronaut Management Endpoints API — Configuration. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/refresh
      name: refresh
      description: REST surface for refresh.
      operations:
      - method: POST
        name: refresh
        description: Micronaut Refresh application configuration
        call: management-configuration.refresh
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Micronaut Management Endpoints API — Configuration. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: micronaut-refresh-application-configuration
      description: Micronaut Refresh application configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-configuration.refresh
      outputParameters:
      - type: object
        mapping: $.
